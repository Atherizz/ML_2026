[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-2026"
version = "0.1.0"
description = "Repository praktikum Machine Learning 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "opencv-python",
    "pillow",
    "requests",
    "hdbscan",
    "faiss-cpu",
    "annoy",
    # Gunakan chroma-hnswlib karena menyediakan prebuilt binary wheel untuk Windows (tanpa butuh compiler MSVC C++).
    # Di kode Python tetap di-import sebagai: `import hnswlib`
    "chroma-hnswlib",
    "ipykernel",
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
packages = []
